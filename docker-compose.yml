version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: code_execution_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: code_execution_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  eureka:
    image: steeltoeoss/eureka-server
    container_name: code_execution_eureka
    ports:
      - "8761:8761"

volumes:
  postgres_data:
